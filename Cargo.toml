[package]
name = "driverforge"
version = "1.0.0"
edition = "2021"
description = "Scans every device driver on this machine, fetches the true latest versions straight from NVIDIA/AMD/Microsoft online, and silently installs anything missing or outdated. Pure Rust, no external scripts."

[[bin]]
name = "DriverForge"
path = "src/main.rs"

[dependencies]
wmi = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
regex = "1"
winreg = "0.55"
chrono = "0.4"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Restore",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Services",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_WindowsProgramming",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_Wmi",
    "Win32_System_Rpc",
    "Win32_System_Console",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
